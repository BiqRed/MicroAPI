[project]
name = "microapi"
version = "1.1.0"
description = "A Python microservices framework with FastAPI-like interface for seamless inter-service communication"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "BiqRed" },
]
keywords = ["microservices", "rpc", "grpc", "framework", "async"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0",
    "orjson>=3.9",
    "jinja2>=3.1",
    "watchfiles>=0.21",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
grpc = ["h2>=4.1", "hpack>=4.0"]
http = ["aiohttp>=3.9"]
ws = ["websockets>=13.0"]
kafka = ["aiokafka>=0.10"]
rabbitmq = ["aio-pika>=9.4"]
all = ["microapi[grpc,http,ws,kafka,rabbitmq]"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
microapi = "microapi.cli.main:app"

[project.urls]
Homepage = "https://github.com/BiqRed/MicroAPI"
Repository = "https://github.com/BiqRed/MicroAPI"
Issues = "https://github.com/BiqRed/MicroAPI/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["microapi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
